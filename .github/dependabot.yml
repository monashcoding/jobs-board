version: 2
updates:
  # Website npm dependencies
  - package-ecosystem: "npm"
    directory: "/apps/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      nextjs:
        patterns:
          - "next"
          - "@next/*"
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]

  # Discord bot Python dependencies
  - package-ecosystem: "pip"
    directory: "/apps/discord-bot"
    schedule:
      interval: "weekly"

  # Service Go modules
  - package-ecosystem: "gomod"
    directory: "/apps/service"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
