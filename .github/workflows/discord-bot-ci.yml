name: Discord Bot CI

on:
  push:
    branches: [development]
    paths:
      - "apps/discord-bot/**"
      - ".github/workflows/discord-bot-ci.yml"
  pull_request:
    paths:
      - "apps/discord-bot/**"
      - ".github/workflows/discord-bot-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: apps/discord-bot

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/discord-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/discord-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
