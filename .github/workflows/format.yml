name: Go Format

on:
  # Run on all pushes to any branch
  push:
  # Run on all pull requests
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check formatting
        run: |
          if [ -n "$(go fmt ./...)" ]; then
            echo "Code is not formatted, please run 'go fmt ./...'"
            exit 1
          fi