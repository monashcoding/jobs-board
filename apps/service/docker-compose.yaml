# Local development only. Dokploy builds the Dockerfile directly and injects
# environment variables itself, so it does not use this file.
#
#   docker compose build
#   docker compose run --rm scraper /app/scraper

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mploy-go-scraper
    env_file:
      - .env
    volumes:
      # Inspect the pipeline's JSON output from the host
      - ./debug:/app/debug
